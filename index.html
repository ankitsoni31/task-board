<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <nav>
    <div class="left">Task<span>Flow</span></div>   
    <div class="right">
      <button id="toggle-modal">Add Task</button>
      <button id="clear-all">Clear</button>
    </div>
  </nav>

  <section class="board">

    <div id="todo" class="task-column">
      <div class="heading">
        <div>To Do</div>
        <div class="right">0</div>
      </div>
    </div>

    <div id="progress" class="task-column">
      <div class="heading">
        <div>Progress</div>
        <div class="right">0</div>
      </div>
    </div>
    <div id="done" class="task-column">
      <div class="heading">
        <div>Done</div>
        <div class="right">0</div>
      </div>
    </div>

  </section>
</main>

<!-- MODAL -->
<div class="modal">
  <div class="bg"></div>
  <div class="center">
    <input id="task-title-input" placeholder="Title">
    <textarea id="task-desc-input" placeholder="Description"></textarea>
    <button id="add-new-task">Add Task</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
